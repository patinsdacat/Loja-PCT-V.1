<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Loja — Patinagem Clube de Tavira</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2c3e50">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Loja Clube">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #2c3e50;
      overflow: hidden;
    }

    iframe {
      border: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #aviso-iframe {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #1a1a1a;
      border: 2px solid #FFD700;
      border-radius: 14px;
      padding: 24px;
      text-align: center;
      color: #fff;
      font-family: Arial, sans-serif;
      max-width: 320px;
    }

    #aviso-iframe a {
      color: #FFD700;
    }
  </style>
</head>

<body>
  <iframe id="loja-iframe"
    src="https://script.google.com/macros/s/AKfycbwNTw2knwRrC7JX7tMOa5ZOZkVGNUF2s8J7RK5deNlfWyoJA-igqF7lmLFNk3bck2AFeA/exec"></iframe>

  <div id="aviso-iframe">
    <p>⚠️ A loja não abriu dentro da app.</p>
    <p style="font-size:0.85em;color:#ccc">Toca abaixo para abrir no navegador:</p>
    <a href="https://script.google.com/macros/s/AKfycbwNTw2knwRrC7JX7tMOa5ZOZkVGNUF2s8J7RK5deNlfWyoJA-igqF7lmLFNk3bck2AFeA/exec"
      target="_top" style="color:#FFD700;font-weight:800">🛍️ Abrir a Loja</a>
  </div>

  <script>
    // Se o iframe não carregar em 8 segundos (cookies bloqueados), mostra o aviso
    var carregou = false;
    document.getElementById('loja-iframe').addEventListener('load', function () { carregou = true; });
    setTimeout(function () {
      if (!carregou) document.getElementById('aviso-iframe').style.display = 'block';
    }, 8000);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        // 🔄 AUTO-ATUALIZAÇÃO do service worker
        reg.addEventListener('updatefound', function () {
          var novo = reg.installing;
          if (!novo) return;
          novo.addEventListener('statechange', function () {
            if (novo.state === 'installed' && navigator.serviceWorker.controller) {
              novo.postMessage('SKIP_WAITING');
            }
          });
        });
        var recarregou = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!recarregou) { recarregou = true; location.reload(); }
        });
        setInterval(function () { reg.update().catch(function () { }); }, 60 * 60 * 1000);
      }).catch(function () { });
    }

    // 📲 PWA: botão flutuante de instalação quando o navegador o permite
    var promptInstalar = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      promptInstalar = e;
      var btn = document.createElement('button');
      btn.textContent = '📲 Instalar no ecrã principal';
      btn.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:99;background:#22c55e;border:0;color:#000;font-weight:800;font-size:0.95em;padding:12px 24px;border-radius:24px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4)';
      btn.onclick = function () {
        promptInstalar.prompt();
        promptInstalar.userChoice.then(function () { btn.remove(); promptInstalar = null; });
      };
      document.body.appendChild(btn);
    });
  </script>
</body>

</html>
