<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Loja — Patinagem Clube de Tavira</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2c3e50">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Loja Clube">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #2c3e50; font-family: Arial, sans-serif; color: #fff; padding: 20px;
    }
    .card {
      max-width: 420px; width: 100%; background: #1a1a1a; border: 2px solid #FFD700;
      border-radius: 14px; padding: 32px 24px; text-align: center;
    }
    .card img { width: 84px; height: 84px; border-radius: 18px; margin-bottom: 16px; }
    h1 { color: #FFD700; font-size: 1.3em; margin: 0 0 12px; }
    p { color: #ccc; line-height: 1.6; font-size: 0.95em; margin: 0 0 20px; }
    button, a.btn-abrir {
      background: #FFD700; border: 0; color: #000; font-weight: 800; font-size: 1.05em;
      padding: 16px 32px; border-radius: 10px; width: 100%; cursor: pointer;
      display: block; text-decoration: none; margin-bottom: 12px;
    }
    a.btn-abrir:hover { filter: brightness(0.95); }
    #btn-instalar { display: none; background: #22c55e; }
    .nota { font-size: 0.8em; color: #888; margin-top: 8px; }
  </style>
</head>

<body>
  <div class="card">
    <img src="icon-192.png" alt="PCT">
    <h1>🏆 Loja — Patinagem Clube de Tavira</h1>

    <a class="btn-abrir" href="https://script.google.com/macros/s/AKfycbwNTw2knwRrC7JX7tMOa5ZOZkVGNUF2s8J7RK5deNlfWyoJA-igqF7lmLFNk3bck2AFeA/exec"
       target="_top">🛍️ Abrir a Loja</a>

    <button id="btn-instalar" onclick="instalarApp()">📲 Instalar a App</button>

    <p class="nota">
      Instala no telemóvel para receberes as notificações (encomenda, pagamento, levantamento).
      No iPhone: botão Partilhar → "Adicionar ao Ecrã Principal".
    </p>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        // 🔄 AUTO-ATUALIZAÇÃO do service worker
        reg.addEventListener('updatefound', function () {
          var novo = reg.installing;
          if (!novo) return;
          novo.addEventListener('statechange', function () {
            if (novo.state === 'installed' && navigator.serviceWorker.controller) {
              novo.postMessage('SKIP_WAITING');
            }
          });
        });
        var recarregou = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!recarregou) { recarregou = true; location.reload(); }
        });
        setInterval(function () { reg.update().catch(function () {}); }, 60 * 60 * 1000);
      }).catch(function () {});
    }

    // 📲 PWA: mostra o botão de instalação quando o navegador o permite
    var promptInstalar = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      promptInstalar = e;
      document.getElementById('btn-instalar').style.display = 'block';
    });
    function instalarApp() {
      if (!promptInstalar) return;
      promptInstalar.prompt();
      promptInstalar.userChoice.then(function () { promptInstalar = null; });
    }
  </script>
</body>

</html>
