<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Notificações — Loja Clube</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2c3e50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Loja Clube">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2c3e50;
      font-family: Arial, sans-serif;
      color: #fff;
      padding: 20px;
    }

    .card {
      max-width: 420px;
      width: 100%;
      background: #1a1a1a;
      border: 2px solid #FFD700;
      border-radius: 14px;
      padding: 32px 24px;
      text-align: center;
    }

    .card img {
      width: 84px;
      height: 84px;
      border-radius: 18px;
      margin-bottom: 16px;
    }

    h1 {
      color: #FFD700;
      font-size: 1.3em;
      margin: 0 0 12px;
    }

    p {
      color: #ccc;
      line-height: 1.6;
      font-size: 0.95em;
      margin: 0 0 24px;
    }

    button {
      background: #FFD700;
      border: 0;
      color: #000;
      font-weight: 800;
      font-size: 1.05em;
      padding: 16px 32px;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
    }

    button:disabled {
      background: #666;
      color: #999;
    }

    .campo {
      margin-bottom: 14px;
      text-align: left;
    }

    .campo label {
      display: block;
      color: #FFD700;
      font-size: 0.8em;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .campo input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #111;
      color: #fff;
      font-size: 1em;
    }

    .oculto {
      display: none;
    }
  </style>
</head>

<body>
  <div class="card">
    <img src="icon-192.png" alt="PCT">
    <h1>🔔 Ativar Notificações</h1>

    <!-- MODO MANUAL: identificar-se (só usado se a loja não abrir a janela automática) -->
    <div id="passo-identificar">
      <p>Recebe um balão no telemóvel quando:</p>
      <p style="font-size:0.85em; text-align:left; margin-bottom:20px">
        • Faz uma encomenda (aviso aos admins)<br>
        • O pagamento é confirmado ✅<br>
        • A encomenda estiver pronta para levantamento 📦
      </p>
      <div class="campo">
        <label>O teu NIF de atleta (o mesmo que usas para entrar na loja)</label>
        <input id="nif" inputmode="numeric" placeholder="Ex: 123456789">
      </div>
      <button id="btn-ativar">🔔 Ativar notificações</button>
    </div>

    <!-- PASSO 2: resultado -->
    <div id="passo-resultado" class="oculto">
      <h1 id="res-titulo"></h1>
      <p id="res-texto"></p>
      <a href="https://script.google.com/macros/s/AKfycbwNTw2knwRrC7JX7tMOa5ZOZkVGNUF2s8J7RK5deNlfWyoJA-igqF7lmLFNk3bck2AFeA/exec"
        style="color:#FFD700">← Voltar à loja</a>
    </div>
  </div>

  <!-- OneSignal Web Push SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

  <script>
    // 🔧 SUBSTITUI pelo teu ONE SIGNAL APP ID
    var ONESIGNAL_APP_ID = '085895b5-1328-46ec-87a2-175347e2a333';

    // Backend (Apps Script da loja)
    var URL_BACKEND = 'https://script.google.com/macros/s/AKfycbwNTw2knwRrC7JX7tMOa5ZOZkVGNUF2s8J7RK5deNlfWyoJA-igqF7lmLFNk3bck2AFeA/exec';

    var resultado = function (titulo, texto) {
      document.getElementById('passo-identificar').classList.add('oculto');
      document.getElementById('passo-resultado').classList.remove('oculto');
      document.getElementById('res-titulo').textContent = titulo;
      document.getElementById('res-texto').textContent = texto;
    };

    // ============================================================
    // Identifica o utilizador SEM pedir NIF:
    // a loja abre esta página com ?auto=1&token=<sessão>.
    // O backend valida o token e devolve o NIF/ID — zero escrita.
    // ============================================================
    var params = new URLSearchParams(location.search);
    var auto = params.get('auto') === '1';
    var tokenLoja = params.get('token');

    async function obterNif() {
      // Modo automático: a sessão da loja diz-nos quem é
      if (auto && tokenLoja) {
        var r = await fetch(URL_BACKEND + '?acao=pushQuemSou&token=' + encodeURIComponent(tokenLoja));
        var d = await r.json();
        if (d && d.sucesso && d.nif) return { nif: d.nif, userId: d.userId };
        throw new Error('Sessão expirada — entra na loja e tenta de novo.');
      }
      // Modo manual (fallback): pede o NIF
      var nif = document.getElementById('nif').value.replace(/\D/g, '');
      if (!nif || nif.length < 9) throw new Error('Escreve o teu NIF (9 dígitos).');
      return { nif: nif, userId: null };
    }

    async function ativar() {
      var btn = document.getElementById('btn-ativar');
      try {
        var quem = await obterNif();
        if (btn) { btn.disabled = true; btn.textContent = 'A ativar…'; }

        // 1) Inicia o OneSignal e pede a permissão do sistema
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        await new Promise(function (resolve) {
          OneSignalDeferred.push(async function (OneSignal) {
            await OneSignal.init({
              appId: ONESIGNAL_APP_ID,
              safari_web_id: 'web.onesignal.auto.1997779e-e1de-41f4-ac74-4543cfbf0412',
              serviceWorkerParam: { scope: '/' },
              serviceWorkerPath: 'OneSignalSDKWorker.js',
              promptOptions: { slidedown: { enabled: false } }
            });
            resolve();
          });
        });

        // 2) Espera o utilizador aceitar e obtém o ID de subscrição
        var subscription = null;
        for (var tent = 0; tent < 30 && !subscription; tent++) {
          await new Promise(function (r) { setTimeout(r, 500); });
          subscription = await OneSignal.User.PushSubscription.id;
        }
        if (!subscription) { resultado('⏰ Tempo esgotado', 'Não autorizaste as notificações. Recarrega a página e tenta de novo.'); return; }

        // Pedido de permissão do sistema (após init, com SDK carregado)
        try {
          var perm = await OneSignal.Notifications.permission;
          if (perm !== true) {
            await OneSignal.Notifications.requestPermission();
          }
        } catch (e) { /* alguns browsers mostram o pedido ao registar */ }

        // 3) Liga a subscrição ao ID interno do utilizador (external_id)
        await OneSignal.login(String(quem.userId || quem.nif));

        // 4) Regista também no backend (folha PushTokens)
        await fetch(URL_BACKEND + '?acao=pushRegistar&nif=' + quem.nif + '&onesignalId=' + encodeURIComponent(subscription));

        resultado('✅ Tudo pronto!', 'Vais receber as notificações no telemóvel.');

        // Modo automático: avisa a loja e fecha sozinho
        if (auto) {
          try { window.opener && window.opener.postMessage('push-ativo', '*'); } catch (e) { }
          setTimeout(function () { window.close(); }, 1500);
        }
      } catch (e) {
        resultado('❌ Erro', String(e.message || e));
      }
    }

    if (auto) {
      // Esconde o formulário e parte direto para a permissão
      document.getElementById('passo-identificar').classList.add('oculto');
      document.getElementById('res-titulo').textContent = '🔔 Um momento…';
      document.getElementById('res-texto').textContent = 'A ativar as tuas notificações…';
      document.getElementById('passo-resultado').classList.remove('oculto');
      window.addEventListener('load', function () { setTimeout(ativar, 800); });
    } else {
      document.getElementById('btn-ativar').addEventListener('click', ativar);
    }
  </script>
</body>

</html>
